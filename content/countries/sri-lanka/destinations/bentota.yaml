slug: bentota
name: Bentota
region: west-coast
coordinates: { lat: 6.421, lng: 79.998 }
summary: Wide beaches, river safaris and Geoffrey Bawa's gardens. Stylish and calm rather than social.
description: |
  Bentota is where the west coast gets polished. It's home to some of Sri Lanka's
  most celebrated design hotels, and to **Lunuganga**, the country estate where
  architect Geoffrey Bawa spent four decades shaping a garden around a lake.
  Nearby is **Brief Garden**, the quirkier home of his brother Bevis.

  Between the gardens, take a boat up the **Madu Ganga** mangroves to island
  temples and cinnamon peelers, or simply enjoy the broad, golden beach.
