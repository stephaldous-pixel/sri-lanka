solo:
  social: 1
  socialNotes: >-
    Mostly resorts and couples. Lovely for a quiet treat, but few hostels and
    little nightlife.
  safety:
    - Sea can be rough outside November to April; heed the beach flags.
  tips:
    - Tour a Bawa hotel, or stay in one for a night, as a splurge.
    - Hikkaduwa, 45 minutes south, is much more sociable.
