slug: colombo
name: Colombo
region: colombo
coordinates: { lat: 6.9271, lng: 79.8612 }
summary: A hot, busy capital with brilliant street food, galleries, markets and a seafront at sunset.
description: |
  Plenty of travellers rush through Colombo, but a day or two here is a great
  introduction to modern Sri Lanka. **Pettah's** bazaars are a sensory overload
  of spices, fabric and handcarts, while **Galle Face Green** fills with families,
  kite-flyers and snack stalls as the sun goes down.

  The leafier southern districts (Kollupitiya and Cinnamon Gardens) hold cafés,
  boutiques and the work of architect **Geoffrey Bawa**, including his former
  home, Number 11. Colombo is also the best place to try lamprais, a Dutch Burgher
  speciality of rice and curry baked in a banana leaf.
