highlights:
  - name: Pettah markets
    summary: Wander the crowded lanes of the old trading district, each street specialising in one thing.
    interests: [food, off-the-beaten-path]
  - name: Galle Face Green at sunset
    summary: Seafront promenade with street-food carts, kites and locals out for the evening breeze.
    interests: [food]
  - name: Number 11 & Bawa's Colombo
    summary: Tour Geoffrey Bawa's townhouse and see the Seema Malaka meditation hall on Beira Lake.
    interests: [architecture-design, temples-spirituality]
  - name: Gangaramaya Temple
    summary: Eclectic, much-loved Buddhist temple packed with gifts from devotees.
    interests: [temples-spirituality]
solo:
  social: 2
  socialNotes: >-
    A handful of hostels and plenty of bars and cafés, but most travellers pass
    through quickly. Food tours and walking tours are an easy way to meet people.
  safety:
    - Ignore friendly strangers near Galle Face and Fort offering tuk tuk trips to a "special festival". It ends in a gem shop or an inflated fare.
    - Use PickMe or Uber, or metered tuk tuks; Colombo is the only city where meters are normal.
    - Pettah is very crowded; keep valuables zipped away.
  tips:
    - Do sightseeing early or late. Midday heat is intense.
    - The free Beira Lake and Galle Face areas are lovely after dark and busy with families.
stay:
  budget: [3000, 7000]
  mid: [12000, 25000]
  comfort: [35000, 80000]
  note: Pricier than the rest of the country.
gettingAround: >-
  Walkable in parts, but ride-hailing tuk tuks are cheap and easy. Trains and
  long-distance buses leave from Colombo Fort.
