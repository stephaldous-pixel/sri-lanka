slug: dambulla
name: Dambulla
region: ancient-cities
coordinates: { lat: 7.8567, lng: 80.649 }
summary: Five painted cave temples high on a rock, among Sri Lanka's greatest artistic treasures.
description: |
  Inside a granite outcrop above Dambulla town, five caves have been turned into
  temples over two thousand years. Every surface is covered in **murals** of
  Buddhas, deities and scenes from the Buddha's lives, and the caves hold more
  than 150 statues, including a 14m reclining Buddha.

  It's a short, steep walk up with views over the plains. Most travellers visit
  on a half-day trip from Sigiriya, but Dambulla is also a major bus hub.
