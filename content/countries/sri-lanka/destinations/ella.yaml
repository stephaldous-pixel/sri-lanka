nights: { min: 2, ideal: 3, max: 5 }
highlights:
  - name: Little Adam's Peak
    summary: Gentle walk through tea gardens to a ridge-top viewpoint. Great at sunrise.
    interests: [hiking, scenery]
  - name: Ella Rock
    summary: Half-day hike with big views over the gap. Go early, before the cloud.
    interests: [hiking, scenery]
  - name: Nine Arches Bridge
    summary: Colonial-era stone viaduct in the jungle. Check train times to see one cross.
    interests: [scenery, train-journeys]
  - name: Tea factory tour
    summary: See how leaves become black tea, then taste it overlooking the estates.
    interests: [tea-and-plantations]
solo:
  social: 3
  socialNotes: >-
    Full of hostels, cafés and bars, and very easy to find hiking companions.
    Many people meet travel buddies here.
  safety:
    - Don't walk on the railway tracks when a train is due, and never hang out of train doors.
    - Some Ella Rock "guides" mislead hikers onto paid paths. Use a downloaded map.
    - Paths get slippery and landslide-prone in heavy rain.
  tips:
    - Book the Nanu Oya–Ella train seats as soon as booking opens (30 days ahead).
    - Start hikes by 7am to beat the heat, the crowds and the afternoon cloud.
stay:
  budget: [2500, 6000]
  mid: [9000, 20000]
  comfort: [25000, 60000]
gettingAround: >-
  Walkable village. Trains towards Haputale and Nanu Oya, buses to Wellawaya
  for the south and east. Tuk tuks for viewpoints and waterfalls.
