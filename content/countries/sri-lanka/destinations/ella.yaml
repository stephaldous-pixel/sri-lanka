slug: ella
name: Ella
region: hill-country
coordinates: { lat: 6.8667, lng: 81.0466 }
summary: The hill country's backpacker hub. Easy hikes, tea views, Nine Arches Bridge and the end of the scenic railway.
description: |
  Ella is a small village in a gap in the hills, with views down to the plains
  and an easy, social atmosphere. Most people come for the short hikes: up
  **Little Adam's Peak** for sunrise, through tea and forest to **Ella Rock**, and
  along the tracks to the much-photographed **Nine Arches Bridge** as a train
  rolls over.

  The scenic train from Nanu Oya ends its most famous stretch here. That section
  reopened in June 2026 after cyclone repairs.
