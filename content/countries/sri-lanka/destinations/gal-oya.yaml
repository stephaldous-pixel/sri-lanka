slug: gal-oya
name: Gal Oya National Park
region: east
climateStation: batticaloa
coordinates: { lat: 7.22, lng: 81.53 }
summary: The only place in Sri Lanka to see elephants swimming between islands, from a boat.
description: |
  Gal Oya surrounds **Senanayake Samudra**, Sri Lanka's largest lake, ringed by
  forested hills and granite peaks. Its unique experience is a **boat safari**:
  with luck you'll watch herds of elephants swim between islands, trunks raised
  like snorkels.

  It sees very few visitors. Lodges also offer jeep safaris, walks with the
  indigenous Vedda community and excellent birding.
