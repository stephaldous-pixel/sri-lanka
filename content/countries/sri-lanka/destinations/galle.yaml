solo:
  social: 2
  socialNotes: >-
    Calm and very safe to wander. A few hostels, but more couples than
    backpackers. Walking tours are a good way to meet people.
  safety:
    - Very relaxed and safe, including after dark inside the fort.
    - Tuk tuks waiting at the fort entrance charge more than app-booked rides.
  tips:
    - Explore early or late; it's very hot at midday and many shops open around 10am.
    - Stay just outside the fort for better value, or in it for atmosphere.
