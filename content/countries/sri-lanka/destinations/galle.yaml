slug: galle
name: Galle
region: south
coordinates: { lat: 6.0267, lng: 80.217 }
summary: A walled colonial fort town of boutiques, churches and sunset ramparts. The south's cultural highlight.
description: |
  Galle Fort is a UNESCO-listed town inside 17th-century Dutch walls, built on a
  headland that Portuguese, Dutch and British traders all fought over. Inside are
  quiet lanes of colonial villas, churches, mosques, galleries and some of the
  most stylish shops and cafés in the country.

  The best time is late afternoon, when locals, couples and travellers stroll the
  **3km of ramparts** to watch the sun set over the ocean. Look for turtles off
  Neptune Bastion and the daredevil divers at Flag Rock.
