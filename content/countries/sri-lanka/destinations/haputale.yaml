slug: haputale
name: Haputale
region: hill-country
coordinates: { lat: 6.7656, lng: 80.9581 }
summary: A ridge-top town with enormous views, sunrise at Lipton's Seat and quiet tea-estate walks.
description: |
  Haputale sits on a knife-edge ridge, with views south to the coast on clear
  mornings. It's a quieter alternative to Ella: fewer cafés, more tea pickers
  and buses than tourists.

  Catch an early bus or tuk tuk to **Lipton's Seat**, where tea baron Thomas
  Lipton surveyed his estates, then walk down through the **Dambatenne** tea
  gardens. It's also a good base for **Horton Plains**.
interests:
  tea-and-plantations: 3
