highlights:
  - name: Lipton's Seat at sunrise
    summary: Panoramic viewpoint above a sea of tea, best before the mist rises.
    interests: [scenery, tea-and-plantations]
  - name: Dambatenne tea factory
    summary: Historic factory founded by Lipton, with tours of the process.
    interests: [tea-and-plantations, history]
  - name: Pekoe Trail sections
    summary: Walk waymarked stages of the long-distance tea trail between villages.
    interests: [hiking]
solo:
  social: 1
  socialNotes: >-
    Quiet, with few travellers. Good for a peaceful stop, less so for meeting
    people.
  safety:
    - Roads are narrow and winding. Take care walking along them.
    - Mist can roll in fast on hikes; carry a layer and a downloaded map.
  tips:
    - Nights are cool; bring a warm layer.
    - Few restaurants. Guesthouse home-cooked dinners are often the best option.
stay:
  budget: [3000, 6000]
