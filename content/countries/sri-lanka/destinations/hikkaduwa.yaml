highlights:
  - name: Surf lessons at Narigama
    summary: Gentle beach breaks with plenty of schools and board rental.
    interests: [surfing]
  - name: Snorkel with turtles
    summary: Green turtles feed on the reef just off the beach.
    interests: [diving-snorkelling, wildlife]
  - name: Wreck diving
    summary: Dive the 19th-century Earl of Shaftesbury and other wrecks (November to April).
    interests: [diving-snorkelling]
  - name: Tsunami memorial, Peraliya
    summary: Community-run museum and memorial to the 2004 tsunami.
    interests: [history]
solo:
  social: 3
  socialNotes: >-
    Hostels, surf schools and beach bars make it very easy to meet people,
    especially at weekends.
  safety:
    - Keep an eye on your drink at beach parties; spiking has been reported in south-coast party towns.
    - The coast road is busy and fast. Take care walking along it at night.
  tips:
    - The quieter southern end of the beach has more space.
    - Touching or feeding the turtles is harmful. Watch from a distance.
