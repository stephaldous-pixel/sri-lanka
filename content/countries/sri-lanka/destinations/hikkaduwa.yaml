slug: hikkaduwa
name: Hikkaduwa
region: west-coast
coordinates: { lat: 6.1395, lng: 80.1063 }
summary: Sri Lanka's original surf town. Beach breaks, turtles in the shallows, wreck dives and lively nights.
description: |
  Hikkaduwa put Sri Lanka on the surfing map in the 1970s. The scene has since
  spread along the south coast, but it remains an easy, fun base. Beginners learn
  on the sandy breaks around **Narigama**, **sea turtles** graze in the shallow
  reef close to shore, and divers head out to century-old **shipwrecks**.

  It has some of the island's biggest beach parties. Just north, the tsunami
  memorial and museum at **Peraliya** is a moving reminder of 2004.
