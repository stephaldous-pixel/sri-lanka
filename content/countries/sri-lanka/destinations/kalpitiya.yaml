slug: kalpitiya
name: Kalpitiya
region: west-coast
coordinates: { lat: 8.2297, lng: 79.7581 }
summary: Remote peninsula with world-class kitesurfing, dolphin superpods and empty sand.
description: |
  At the end of a long, sandy peninsula north of Negombo, Kalpitiya has steady
  wind for about eight months a year and shallow, flat lagoons. That makes it
  one of the best places in Asia to **learn to kitesurf**. Kite camps line the
  lagoon, and most beginners take a three-day course.

  Outside kite season the draw is the ocean: between November and April, boats
  head out to find **pods of hundreds of spinner dolphins**, and sometimes
  whales. Bar Reef, Sri Lanka's largest reef, lies offshore.
