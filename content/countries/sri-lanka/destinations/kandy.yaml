solo:
  social: 2
  socialNotes: >-
    Several hostels and a steady flow of travellers between the coast and the
    hills. Walking tours and cooking classes are good for meeting people.
  safety:
    - Touts around the lake and temple offer "free" guiding that ends in a shop. Politely decline.
    - The town centre is busy and polluted at rush hour; walk early or late.
  tips:
    - Colombo trains currently end at Peradeniya, 6km away. Finish by bus or tuk tuk.
    - The train from Kandy to Ella isn't running all the way yet; go by road to Nanu Oya and take the train from there.
