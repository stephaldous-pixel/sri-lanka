slug: kandy
name: Kandy
region: kandy
coordinates: { lat: 7.2906, lng: 80.6337 }
summary: The last royal capital, around a lake, home to the Temple of the Tooth, the most sacred site in Sri Lankan Buddhism.
description: |
  Kandy was the seat of Sri Lanka's last kings, and it's still the island's
  cultural heart. The gold-roofed **Temple of the Sacred Tooth Relic** holds a
  tooth said to be the Buddha's; time a visit for one of the daily *pujas*, when
  drums sound and worshippers file past with lotus flowers.

  Walk around the lake, explore the hilltop **Udawattakele** forest, and take a
  tuk tuk out to the **Peradeniya Botanical Gardens**. In July or August, the
  ten-night **Esala Perahera** fills the streets with dancers, drummers and fire.
