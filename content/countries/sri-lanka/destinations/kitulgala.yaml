slug: kitulgala
name: Kitulgala
region: hill-country
coordinates: { lat: 6.989, lng: 80.418 }
summary: Sri Lanka's adventure hub. White-water rafting, waterfall abseiling and jungle walks by the river.
description: |
  Kitulgala sits in steep, forested hills along the **Kelani River**, and it's the
  place for an adrenaline fix. Raft the river's rapids, abseil down waterfalls,
  go canyoning or explore caves, then cool off in natural pools.

  Quieter days are spent on birding walks in the lowland rainforest, which is
  home to many of Sri Lanka's endemic species. *The Bridge on the River Kwai* was
  filmed here.
