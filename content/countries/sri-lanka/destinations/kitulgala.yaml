solo:
  social: 2
  socialNotes: >-
    Rafting is done in groups, so it's easy to join others. Evenings are quiet.
  safety:
    - Use operators with proper safety kit and qualified guides.
    - The river level changes fast after heavy rain; trips may be cancelled.
  tips:
    - A good stop between Colombo and the hills, or Colombo and Adam's Peak.
    - Leeches are common in the forest. Leech socks help.
