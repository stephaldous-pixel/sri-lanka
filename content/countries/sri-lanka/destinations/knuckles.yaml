slug: knuckles
name: Knuckles Range
region: kandy
coordinates: { lat: 7.45, lng: 80.79 }
summary: Wild, misty mountains near Kandy for proper guided treks, remote villages and huge views.
description: |
  The Knuckles mountains, named for peaks that look like a clenched fist, are a
  UNESCO-protected wilderness of cloud forest, grassland and terraced paddy. Trails
  lead through villages such as **Meemure**, past waterfalls and up to ridges
  with some of the most spectacular views in the country.

  Hiking here is only allowed with a registered guide, which keeps it quiet and
  makes it feel like a real adventure.
interests:
  hiking: 3
