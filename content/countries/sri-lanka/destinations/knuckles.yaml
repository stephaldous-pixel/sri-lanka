  birdwatching: 1
nights: { min: 1, ideal: 2, max: 3 }
months: [great, great, great, good, mixed, mixed, mixed, good, good, mixed, poor, mixed]
monthsNote: Best January to April and August to September. Some areas were closed after the 2025 cyclone; check with local guides.
highlights:
  - name: Guided day trek
    summary: Ridge walks with views over cloud forest and valleys.
    interests: [hiking, scenery]
  - name: Village homestay in Meemure
    summary: Stay in a remote village reached by a winding mountain road.
    interests: [off-the-beaten-path]
solo:
  social: 2
  socialNotes: >-
    Guided group treks are the norm, so solo travellers can join others easily.
  safety:
    - A registered guide is required. Don't hike alone.
    - Leeches are common and trails get slippery after rain. Bring leech socks.
  tips:
    - Bring snacks and water; there are no facilities on the trails.
    - Arrange treks through Kandy guesthouses or local trekking outfits.
stay:
  budget: [3500, 7000]
  mid: [9000, 18000]
  comfort: [20000, 40000]
gettingAround: >-
  Infrequent buses from Kandy and Matale. Most trekkers arrange transport with
  their guide.
