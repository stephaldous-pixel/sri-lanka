slug: mirissa
name: Mirissa
region: south
coordinates: { lat: 5.9483, lng: 80.4716 }
summary: Palm-fringed party beach and Sri Lanka's whale-watching capital. Blue whales offshore.
description: |
  Mirissa is the south coast's most lively beach town, with a pretty bay,
  seafood barbecues and late nights. It's also the starting point for one of the
  world's best chances to see **blue whales**, the largest animal ever to have
  lived. Boats leave at dawn for the deep water off Dondra Head.

  By day, climb **Coconut Tree Hill** for the classic photo, or wade out to
  Parrot Rock at low tide. Quieter **Secret Beach** is a short tuk tuk ride away.
