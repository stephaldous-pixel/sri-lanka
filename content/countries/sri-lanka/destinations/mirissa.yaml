highlights:
  - name: Whale-watching
    summary: Half-day dawn boat trip for blue whales, plus sperm whales and spinner dolphins.
    interests: [wildlife]
    cost: [18000, 22000]
    costNote: About US$60. Choose an operator that keeps its distance from the whales.
  - name: Coconut Tree Hill
    summary: Palm-covered headland with the town's most photographed view.
    interests: [scenery]
  - name: Secret Beach
    summary: Small, sheltered cove away from the main strip.
    interests: [beaches]
solo:
  social: 3
  socialNotes: >-
    Busy with backpackers, and the beach bars and parties make it easy to meet
    people.
  safety:
    - Drink spiking has been reported in south-coast party spots. Keep your drink with you.
    - Seas are rough from May to July, so avoid whale trips and swimming then.
  tips:
    - Stay in the back lanes to avoid noise from the main road.
    - Seasickness is common on whale trips. Take tablets beforehand.
stay:
