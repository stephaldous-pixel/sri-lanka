solo:
  social: 2
  socialNotes: >-
    A steady flow of travellers arriving and leaving, so hostels are a good place
    to find people to share a driver with for the first leg.
  safety:
    - The main beach strip is touristy; touts are persistent but harmless.
    - Rip currents can be strong. Swim only where locals do.
  tips:
    - Book your first night before landing and ask for an airport pickup.
    - Negombo is a popular place to rent a tuk tuk if you want to drive yourself.
