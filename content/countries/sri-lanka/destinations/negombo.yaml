slug: negombo
name: Negombo
region: west-coast
coordinates: { lat: 7.2083, lng: 79.8358 }
summary: Beach town 20 minutes from the airport. An easy first or last night, with a fantastic fish market.
description: |
  Negombo's closeness to the airport makes it the natural place to recover from a
  long flight, but it rewards a full day too. Get up at dawn (jet lag helps) for
  the **fish auction at Lellama market**, where tuna and mahi-mahi change hands
  at speed, then see the catch laid out to dry near the old Dutch fort.

  In the afternoon, take a boat around the **lagoon and Dutch-era Hamilton Canal**,
  past fishing villages and outrigger canoes, and finish with sunset on the beach.
  It's a strongly Catholic town, with grand pastel churches.
