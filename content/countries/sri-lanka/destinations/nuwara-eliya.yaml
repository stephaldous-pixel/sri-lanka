solo:
  social: 1
  socialNotes: >-
    More domestic tourists and couples than backpackers. Join a shared Horton
    Plains tour to meet people.
  safety:
    - It gets cold at night, sometimes near freezing in January. Bring warm layers.
    - Roads to Kandy were damaged in the 2025 cyclone; check conditions in the rainy season.
  tips:
    - The railway station is Nanu Oya, 9km away; many guesthouses offer pickups.
    - April is local holiday season here and prices spike.
