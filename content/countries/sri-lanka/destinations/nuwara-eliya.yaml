slug: nuwara-eliya
name: Nuwara Eliya & Horton Plains
region: hill-country
coordinates: { lat: 6.9497, lng: 80.7891 }
summary: Sri Lanka's highest town. Tea estates, colonial "Little England" and the dawn hike to World's End.
description: |
  At almost 1,900m, Nuwara Eliya is cool, often misty and surrounded by the most
  productive tea country on the island. The British left behind red-brick
  post offices, rose gardens and a golf course, and high tea is still a ritual.

  The big draw nearby is **Horton Plains National Park**, a high plateau of
  grassland and cloud forest. Its 9km loop leads to **World's End**, a sheer
  cliff dropping almost 900m. Arrive at 7am, before the mist rolls in.
