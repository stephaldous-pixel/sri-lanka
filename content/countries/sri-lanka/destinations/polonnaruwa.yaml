    summary: Rent a bicycle and ride between the main ruins in a morning.
    interests: [history]
    cost: [8000, 10000]
    costNote: About US$25–30 entry.
  - name: Gal Vihara
    summary: Four magnificent Buddha figures carved into a granite face.
    interests: [temples-spirituality, history]
solo:
  social: 1
  socialNotes: >-
    Mostly visited as a day trip. Budget guesthouses are friendly but quiet.
  safety:
    - Start early; there's little shade and midday heat is fierce.
  tips:
    - Buy your ticket at the museum before going to the ruins.
    - Bring socks for walking barefoot on hot stone at temples.
stay:
  budget: [3000, 6000]
  mid: [8000, 16000]
  comfort: [20000, 40000]
gettingAround: >-
  Bicycles and tuk tuks around the site. Buses to Habarana, Dambulla and
  Batticaloa; trains to Colombo and Batticaloa.
