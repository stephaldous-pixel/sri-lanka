slug: polonnaruwa
name: Polonnaruwa
region: ancient-cities
coordinates: { lat: 7.9403, lng: 81.0188 }
summary: A compact medieval capital of palaces, stupas and serene rock-cut Buddhas, best explored by bike.
description: |
  Polonnaruwa was Sri Lanka's capital from the 11th to 13th centuries, and its
  ruins sit close together in parkland beside a vast ancient reservoir. Cycle
  between the royal palace, the tightly packed **Quadrangle** of temples, and
  **Gal Vihara**, where four Buddha figures, seated, standing and reclining, are
  carved from a single slab of granite.

  It's smaller and easier to cover than Anuradhapura, and a good day trip from
  Sigiriya.
