slug: sigiriya
name: Sigiriya
region: ancient-cities
coordinates: { lat: 7.957, lng: 80.7603 }
summary: A 5th-century palace on top of a 180m rock, plus sunrise from neighbouring Pidurangala.
description: |
  Sigiriya is Sri Lanka's most dramatic sight: a sheer granite rock rising from
  the plains, crowned by the ruins of a king's palace. The climb passes water
  gardens, ancient frescoes of celestial maidens, and a staircase between two
  giant stone lion's paws.

  For the classic view *of* Sigiriya, climb **Pidurangala** next door at dawn,
  through an old monastery to a boulder-top summit. Sigiriya village is also the
  best base for the cave temples at Dambulla and the elephant safaris at
  **Minneriya**.
