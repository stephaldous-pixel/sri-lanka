solo:
  social: 2
  socialNotes: >-
    A busy stop on most routes with plenty of guesthouses. Easy to team up for
    safaris and the Pidurangala sunrise.
  safety:
    - Wild elephants roam around the village. Don't walk or cycle on unlit roads after dark.
    - Hornets' nests on the rock occasionally cause closures; follow staff instructions.
  tips:
    - The site opens at 5am. Go early to beat the heat and crowds.
    - Bring water and a hat; there's no shade on top.
