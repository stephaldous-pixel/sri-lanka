slug: tangalle
name: Tangalle & Hiriketiya
region: south
coordinates: { lat: 6.024, lng: 80.794 }
summary: Wild, empty beaches and nesting turtles, plus Hiriketiya's small surf bay nearby.
description: |
  East of the surf towns, the coast gets wilder. Tangalle's long, wave-lashed
  beaches are for walking and switching off rather than swimming, with nesting
  turtles at **Rekawa** and bird-filled lagoons behind the sand.

  Just west, horseshoe-shaped **Hiriketiya** has become a small, stylish surf
  spot with a friendly crowd. Inland, the 500 steps up to the **Mulkirigala rock
  temples** lead to painted caves and big views.
