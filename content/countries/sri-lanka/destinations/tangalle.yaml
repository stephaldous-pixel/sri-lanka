    summary: Small, sheltered surf bay with a sociable café scene.
    interests: [surfing, beaches]
  - name: Mulkirigala rock temples
    summary: Climb to cave temples with 18th-century murals.
    interests: [temples-spirituality, history]
solo:
  social: 2
  socialNotes: >-
    Tangalle itself is quiet and spread out; Hiriketiya has a small, friendly
    surf crowd.
  safety:
    - Tangalle's beaches have steep drops, strong currents and heavy shore breaks. Swimming is dangerous.
    - Only join turtle watches that keep lights off and keep visitors back.
  tips:
    - Hire a scooter or tuk tuk to explore the unmarked beach turn-offs.
