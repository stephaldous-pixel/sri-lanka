slug: trincomalee
name: Trincomalee, Uppuveli & Nilaveli
region: east
coordinates: { lat: 8.605, lng: 81.22 }
summary: Calm summer beaches, the best coral on the island at Pigeon Island, and a clifftop Hindu temple.
description: |
  When the south-west is in monsoon, the east coast is at its best. North of the
  historic port of **Trincomalee**, the long white beaches of **Uppuveli** and
  **Nilaveli** have calm, clear water from April to September.

  Take a boat to **Pigeon Island**, which has Sri Lanka's healthiest coral,
  reef sharks and turtles for snorkellers. In town, walk through Fort Frederick
  to **Koneswaram Temple**, perched on Swami Rock 120m above the sea.
