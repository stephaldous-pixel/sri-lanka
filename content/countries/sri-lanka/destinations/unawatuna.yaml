slug: unawatuna
name: Unawatuna
region: south
coordinates: { lat: 6.0098, lng: 80.2497 }
summary: A sheltered, swimmable bay next to Galle, with snorkelling, diving and an easy-going backpacker scene.
description: |
  Unawatuna's curved bay is one of the calmest places to swim on the south coast,
  just ten minutes from Galle Fort. It's a convenient base: snorkel the reef,
  learn to dive at one of the many dive schools, or walk over the headland to
  little **Jungle Beach**.

  At sunset, climb up to the white **Japanese Peace Pagoda** on Rumassala hill.
  Visitors can join the evening prayers.
