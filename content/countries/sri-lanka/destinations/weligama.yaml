solo:
  social: 3
  socialNotes: >-
    One of the most sociable places in the country. Surf camps and hostels run
    group dinners and trips, and many people stay for weeks.
  safety:
    - Reef breaks in Ahangama and Midigama are for experienced surfers only.
    - Watch your drink at parties.
    - Stilt fishermen often expect payment for photos.
  tips:
    - A surf camp is the easiest way to meet people if you're arriving alone.
    - Go south from December to April; the waves and weather are best then.
