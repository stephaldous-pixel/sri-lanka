slug: weligama
name: Weligama & Ahangama
region: south
coordinates: { lat: 5.975, lng: 80.429 }
summary: The best place to learn to surf, with a sociable hostel and café scene and digital-nomad hubs.
description: |
  Weligama's long, sandy bay has gentle, consistent waves, which makes it Sri
  Lanka's favourite place to **stand up on a surfboard for the first time**. Surf
  schools line the beach, and lessons are cheap.

  Neighbouring **Ahangama** and **Midigama** have more advanced reef breaks,
  surf-and-yoga camps, coworking spaces and some of the island's best cafés. It's
  also the stretch where you'll see the famous **stilt fishermen**.
