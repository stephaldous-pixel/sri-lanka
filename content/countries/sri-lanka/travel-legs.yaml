# Direct connections between neighbouring destinations. The route generator
# chains these together to work out travel time between any two places.
#
# hours = typical door-to-door time. "car" means a hired car with driver or a
# ride-hailing car. Rail status changes often after Cyclone Ditwah (Nov 2025);
# re-check every "disrupted" or "suspended" option before launch.
lastChecked: "2026-10-28"
sources:
  - https://www.seat61.com/SriLanka
  - https://www.dailyexcelsior.com/sri-lanka-resumes-train-service-on-colombo-kandy-line-after-10-months/
  - https://byc.lk/colombo-kandy-ella-train-status-2026
  - https://newsfirst.lk/2026/04/24/special-bus-services-deployed-as-coastal-train-services-remain-disrupted
  - https://goasia.cc/en/sri-lanka/ella-to-arugam-bay
  - https://www.geckoroutes.com/sri-lanka/arugam-bay-things-to-do-and-how-to-get-there/
